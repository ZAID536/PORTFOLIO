<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaid Zaman | Visual Architect & Graphic Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(fn) { activeFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if re-definition is not permitted
        }
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
